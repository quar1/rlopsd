# Qwen/Qwen3-4B, thinking off; math_e Worker performs teacher-first updates.
model_path: ../models/Qwen3-4B
output_root: ../rlopsd-runs
data_root: data
gpus: 0,1
steps: 200
beta: 0.01
teacher_update_interval: -1  # Independent teacher bootstrap; math_e controls actual updates.
teacher_cpu_offload: false
free_cache_engine: false
seed: 42
train_batch_size: 16
val_batch_size: 16
rollout_n: 8
ppo_mini_batch_size: 4
micro_batch_size: 1
ppo_epochs: 1
max_prompt_length: 4096
max_response_length: 4096
thinking: false
lora_rank: 64
lora_alpha: 128
target_modules: .*[.](q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)
learning_rate: 1.0e-06
warmup_steps: 40
lr_scheduler_step_unit: optimizer
global_token_mean: true
weight_decay: 0.0
grad_clip: 1.0
clip_ratio_low: 0.2
clip_ratio_high: 0.28
clip_ratio_c: 10.0
param_offload: false
optimizer_offload: false
gradient_checkpointing: true
entropy_checkpointing: true
temperature: 1.0
top_p: 1.0
top_k: -1
tensor_parallel_size: 2
gpu_memory_utilization: 0.2
max_num_batched_tokens: 4096
max_num_seqs: 16
agent_workers: 4
reward_workers: 2
data_workers: 2
log_prob_micro_batch_size: 1
test_freq: -1
save_freq: 50
max_checkpoints: 4
val_before_train: false
val_max_samples: -1
total_epochs: 100
eval_do_sample: true
eval_temperature: 1.0
eval_n: 12
ray_cpus: 16
ray_object_store_bytes: 2147483648
ray_temp_root: /tmp
threads: 4
offline: true
math_prompt_format: native
teacher_thinking: false
eval_export_freq: 20
rollout_log_num_groups: 4
log_step_losses: true
cache_dir: ../rlopsd-cache
nccl_p2p_disable: true
network_interface: lo
